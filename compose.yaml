services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=olie'
      - 'POSTGRES_USER=olie'
      - 'POSTGRES_PASSWORD=olie'
    ports:
      - '5432'
    volumes:
      - 'olie-postgres-data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U olie -d olie']
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: 'apache/kafka:3.8.0'
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'

  # Sidecar do WhatsApp Web (Baileys). As sessões ficam só no volume local — nunca no repositório.
  whatsapp-gateway:
    build: ./whatsapp-gateway
    ports:
      # só a máquina local alcança o gateway; ele ainda exige o WHATSAPP_GATEWAY_TOKEN em toda chamada
      - '127.0.0.1:3100:3100'
    environment:
      WHATSAPP_GATEWAY_TOKEN: '${WHATSAPP_GATEWAY_TOKEN:-change-this-gateway-token}'
      OLIE_WEBHOOK_URL: '${OLIE_WEBHOOK_URL:-http://host.docker.internal:8090/internal/whatsapp/events}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - 'olie-whatsapp-sessions:/data'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3100/health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  olie-postgres-data:
  olie-whatsapp-sessions:
