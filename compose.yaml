services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=olie'
      - 'POSTGRES_USER=olie'
      - 'POSTGRES_PASSWORD=olie'
    ports:
      - '5432'
    volumes:
      - 'olie-postgres-data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U olie -d olie']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  olie-postgres-data:
