server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: backend

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop

jwt:
  secret: ${JWT_SECRET:change-this-super-secret-key-before-going-to-production-0123456789}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

logging:
  level:
    org.springframework.security: INFO
